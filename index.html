<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cars</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body class="container mb-2">
    <img src="back.png" alt="" class="img-fluid">
    <details>
        <summary class="fs-5">Search field</summary>
        <div>
            <select name="" id="szuro" class="form-select">
                <option value="all">All</option>
                <option value="newCars">New Cars</option>
                <option value="usedCars">Used Cars</option>
            </select>
        </div>
        <input type="text" placeholder="Search" class="form-control mt-2" id="kereso">
    </details>
    <div class="row row-cols-1 row-cols-xl-3 row-cols-md-2 mt-3 gy-3 gx-3" id="tarolo">
        <div class="col h-100">
            <img src="https://nodejs112.dszcbaross.edu.hu/car_01.png" class="rounded-top-4 card-img-top" alt="">
            <div class="border-bottom border-start border-end border-1 p-3 rounded-bottom-4">
                <div class="fw-bold fs-5">Ford Transit – 2021</div>
                <div>4.0 D5 PowerPulse Momentum 5dr AW…</div>
                <hr>
                <div class="d-flex justify-content-between">
                    <div class="text-center">
                        <img src="miles.svg" class="card-img-top w-25" alt="">
                        <div class="fs-6 mt-2">2500 Miles</div>
                    </div>
                    <div class="text-center">
                        <img src="fuel.svg" class="card-img-top w-50" alt="">
                        <div class="fs-6 mt-2">Diesel</div>
                    </div class="text-center">
                    <div class="text-center">
                        <img src="transmission.svg " class="card-img-top w-50" alt="">
                        <div class="fs-6 mt-2">Manual</div>
                    </div>
                </div>
                <hr>
                <div class="d-flex justify-content-between">
                    <div class="fs-4 fw-bold">$22 000</div>
                    <button class="btn btn-light">View Details</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
